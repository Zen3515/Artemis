name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate tag and derive Android version
        id: version
        shell: bash
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          if [[ ! "${tag}" =~ ^v(.+)$ ]]; then
            echo "Tag '${tag}' is invalid. Expected format: v12.1.250118" >&2
            exit 1
          fi

          version_name="${BASH_REMATCH[1]}"
          version_code=$((100000 + GITHUB_RUN_NUMBER))
          artifact_prefix="Artemis-${tag}"

          {
            echo "version_name=${version_name}"
            echo "version_code=${version_code}"
            echo "artifact_prefix=${artifact_prefix}"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate signing secrets
        shell: bash
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          for key in \
            ANDROID_RELEASE_KEYSTORE_BASE64 \
            ANDROID_RELEASE_STORE_PASSWORD \
            ANDROID_RELEASE_KEY_ALIAS \
            ANDROID_RELEASE_KEY_PASSWORD
          do
            if [[ -z "${!key:-}" ]]; then
              echo "Missing required GitHub Actions secret: ${key}" >&2
              exit 1
            fi
          done

      - name: Decode Android signing keystore
        id: signing
        shell: bash
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          keystore_path="${RUNNER_TEMP}/android-release.jks"
          printf '%s' "${ANDROID_RELEASE_KEYSTORE_BASE64}" | base64 --decode > "${keystore_path}"
          echo "keystore_path=${keystore_path}" >> "${GITHUB_OUTPUT}"

      - name: Build release APKs
        env:
          ANDROID_RELEASE_STORE_FILE: ${{ steps.signing.outputs.keystore_path }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease \
            -PreleaseVersionName="${{ steps.version.outputs.version_name }}" \
            -PreleaseVersionCode="${{ steps.version.outputs.version_code }}"

      - name: Collect release artifacts
        id: artifacts
        shell: bash
        run: |
          set -euo pipefail

          nonroot_apk="$(find app/build/outputs/apk/nonRoot_game/release -maxdepth 1 -type f -name '*.apk' | sort | head -n 1)"
          root_apk="$(find app/build/outputs/apk/root/release -maxdepth 1 -type f -name '*.apk' | sort | head -n 1)"

          if [[ -z "${nonroot_apk}" || -z "${root_apk}" ]]; then
            echo "Expected both root and nonRoot release APKs to be present" >&2
            exit 1
          fi

          artifact_prefix="${{ steps.version.outputs.artifact_prefix }}"
          nonroot_name="${artifact_prefix}-nonRoot-release.apk"
          root_name="${artifact_prefix}-root-release.apk"

          cp "${nonroot_apk}" "${nonroot_name}"
          cp "${root_apk}" "${root_name}"
          sha256sum "${nonroot_name}" > "${nonroot_name}.sha256"
          sha256sum "${root_name}" > "${root_name}.sha256"

          {
            echo "nonroot_apk=${nonroot_name}"
            echo "nonroot_sha=${nonroot_name}.sha256"
            echo "root_apk=${root_name}"
            echo "root_sha=${root_name}.sha256"
          } >> "${GITHUB_OUTPUT}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            Android release build for `${{ github.ref_name }}`.

            - `versionName`: `${{ steps.version.outputs.version_name }}`
            - `versionCode`: `${{ steps.version.outputs.version_code }}`
            - `variants`: `nonRoot_gameRelease`, `rootRelease`
            - `signing`: GitHub Actions keystore secrets
          files: |
            ${{ steps.artifacts.outputs.nonroot_apk }}
            ${{ steps.artifacts.outputs.nonroot_sha }}
            ${{ steps.artifacts.outputs.root_apk }}
            ${{ steps.artifacts.outputs.root_sha }}
